<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- pre-JS paint only, matched to the OS scheme so there's no flash before boot
     runs — app.js overwrites these to the app's own theme right after, since
     a user who toggled dark inside Value while their OS stayed light would
     otherwise get a status bar painted for a theme that isn't on screen -->
<meta name="theme-color" content="#F2F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101412" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Value</title>
<meta name="description" content="Compare grocery prices per litre, kilo or piece.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-any-512.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="src/styles.css">
<script type="module" src="src/app.js"></script>
</head>
<body>

<div class="pin">
  <div class="bar">
    <!-- the two comparisons, first thing on the page. Retailers: one product
         across stores. Options: brands of one product in the store you're
         standing in — the one actually used most. -->
    <div class="tabs" role="tablist" aria-label="What to compare">
      <button role="tab" id="tabOptions"   data-mode="options"   aria-selected="true">Options</button>
      <button role="tab" id="tabRetailers" data-mode="retailers" aria-selected="false">Retailers</button>
    </div>
    <button class="icon-btn" id="theme" aria-label="Switch theme">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
    </button>
    <button class="icon-btn" id="clearAll" aria-label="Clear all entries" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3Z"/></svg>
    </button>
  </div>

  <!-- the unit, chosen once for the whole round. One unit for every row is why
       weight and volume can no longer be mixed: there is no mixed state to
       detect any more. -->
  <div class="units" id="units" role="radiogroup" aria-label="Unit"></div>

  <!-- the answer lives in the winning row; this only appears when that row has
       scrolled out of sight, which on a normal screen it never does -->
  <div class="sum" id="sum" aria-hidden="true"></div>
</div>

<div class="legend" id="legend" aria-hidden="true">
  <span></span><span>Amount</span><span>Price</span><span>per kg</span>
</div>

<div class="rows" id="rows"></div>

<button class="add" id="addOption">Add option</button>

<details class="manage" id="manage">
  <summary>
    Manage retailers
    <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5Z"/></svg>
  </summary>
  <div class="manage-body" id="manageBody"></div>
</details>

<p class="hint" id="hint">Prices normalise to a litre, a kilo, or a piece.</p>

</body>
</html>
