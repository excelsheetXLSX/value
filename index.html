<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- pre-JS paint only, matched to the OS scheme so there's no flash before boot
     runs — app.js overwrites these to the app's own theme right after, since
     a user who toggled dark inside Value while their OS stayed light would
     otherwise get a status bar painted for a theme that isn't on screen -->
<meta name="theme-color" content="#F2F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Value</title>
<meta name="description" content="Compare grocery prices per litre, kilo or piece.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-any-512.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="src/styles.css">
<script type="module" src="src/app.js"></script>
</head>
<body>

<header class="bar">
  <h1>Value<svg class="mark" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="12" width="5" height="8" rx="2" fill="var(--primary)"/><g fill="currentColor"><rect x="9.5" y="8" width="5" height="12" rx="2"/><rect x="16.5" y="4" width="5" height="16" rx="2"/></g></svg></h1>
  <button class="icon-btn" id="theme" aria-label="Switch theme">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
  </button>
  <button class="text-btn" id="clearAll" disabled>Clear all</button>
</header>

<section id="winner" aria-live="polite">
  <div class="w-empty">Fill in a row to start comparing.</div>
</section>

<div id="lock">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9Zm-8-2a3 3 0 0 1 6 0v2H9Z"/></svg>
  <span id="lockText"></span>
</div>

<div class="rows" id="rows"></div>

<details class="manage">
  <summary>
    Manage retailers
    <svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5Z"/></svg>
  </summary>
  <div class="manage-body" id="manageBody"></div>
</details>

<p class="hint">Prices normalise to a litre, a kilo, or a piece.</p>

<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grip"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">Unit</h2>
    <button class="clr" id="sheetClear">Clear</button>
  </div>
  <div id="sheetGroups"></div>
</div>

</body>
</html>
